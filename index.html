<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concentration MemoGame</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Level Selection Screen -->
    <div id="level-selection-screen">
        <h1>Choose Difficulty Level</h1>
        <button class="level-btn" id="easy-btn">Easy</button>
        <button class="level-btn" id="medium-btn">Medium</button>
        <button class="level-btn" id="hard-btn">Hard</button>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" style="display: none;">
        <h1>Welcome to My MemoGame!</h1>
        <p>Match all pairs of cards before time runs out or you exceed the incorrect guess limit.</p>
        <button id="start-btn">Start Game</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" style="display: none;">
        <div id="timer">Timer: 00:00</div>
        <div id="correct-guesses">Correct Guesses: 0</div>
        <div id="incorrect-guesses">Incorrect Guesses: 0</div>
        <div id="game-board" class="grid"></div>
        <button id="restart-btn" style="display: none;">Restart</button>
        <button id="exit-btn" style="display: none;">Exit</button>
        <div id="message" style="display: none;"></div>
        
        <!-- Faces for Win/Loss -->
        <img id="win-face" class="face-image" src="assets/happy.png" style="display: none;"/>
        <img id="lose-face" class="face-image" src="assets/sad.png" style="display: none;"/>

        <div id="game-over" style="display: none;">
            <h1>Game Over!</h1>
            <p>Final Score: <span id="final-score"></span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
